name: Build AutoClipper AI Hybrid v4.3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 3. GRADLE 8.9
      # ==================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ==================================================
      # 4. SETUP ANDROID SDK
      # ==================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==================================================
      # 5. INSTALL SDK
      # ==================================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==================================================
      # 6. EXTRACT SOURCE ZIP
      # ==================================================
      - name: Extract AutoClipper source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FILES IN REPOSITORY"
          echo "======================================"

          find . -maxdepth 2 -type f | sort

          ZIP=$(find . -maxdepth 1 -type f \
            \( \
              -iname "*v4.3*.zip" \
              -o -iname "*Hybrid*v4*.zip" \
              -o -iname "*AutoClipper*.zip" \
            \) \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Source ZIP tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "ZIP ditemukan:"
          echo "$ZIP"

          rm -rf _extract
          mkdir -p _extract

          unzip -q "$ZIP" -d _extract

          echo ""
          echo "======================================"
          echo "MENCARI PROJECT ANDROID"
          echo "======================================"

          SETTINGS=$(find _extract \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            echo ""
            echo "Isi ZIP:"
            find _extract -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project ditemukan:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Menyalin project..."

          cp -a "$PROJECT_DIR"/. .

          rm -rf _extract

          echo ""
          echo "======================================"
          echo "PROJECT SETELAH EXTRACT"
          echo "======================================"

          ls -la


      # ==================================================
      # 7. CHECK PROJECT
      # ==================================================
      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHECK PROJECT"
          echo "======================================"

          if [ -f settings.gradle ]; then
            echo "OK: settings.gradle"
          elif [ -f settings.gradle.kts ]; then
            echo "OK: settings.gradle.kts"
          else
            echo "ERROR: settings.gradle tidak ditemukan"
            exit 1
          fi

          if [ -f build.gradle ]; then
            echo "OK: build.gradle"
          elif [ -f build.gradle.kts ]; then
            echo "OK: build.gradle.kts"
          else
            echo "ERROR: build.gradle tidak ditemukan"
            exit 1
          fi

          if [ -f app/build.gradle ]; then
            echo "OK: app/build.gradle"
          elif [ -f app/build.gradle.kts ]; then
            echo "OK: app/build.gradle.kts"
          else
            echo "ERROR: app/build.gradle tidak ditemukan"
            exit 1
          fi

          if [ -f app/src/main/AndroidManifest.xml ]; then
            echo "OK: AndroidManifest.xml"
          else
            echo "ERROR: AndroidManifest.xml tidak ditemukan"
            exit 1
          fi

          echo ""
          echo "PROJECT OK"


      # ==================================================
      # 8. CHECK MAIN ACTIVITY
      # ==================================================
      - name: Check MainActivity
        shell: bash
        run: |
          set -e

          find app/src/main -type f | sort

          if [ ! -f app/src/main/java/com/autoclipper/ai/MainActivity.java ]; then
            echo ""
            echo "ERROR: MainActivity.java tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "MainActivity OK"


      # ==================================================
      # 9. SHOW GRADLE VERSION
      # ==================================================
      - name: Check Gradle
        shell: bash
        run: |
          gradle --version


      # ==================================================
      # 10. BUILD APK
      # ==================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILD APK"
          echo "======================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ==================================================
      # 11. FIND APK
      # ==================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "APK RESULT"
          echo "======================================"

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "APK:"
          echo "$APK"


      # ==================================================
      # 12. RENAME APK
      # ==================================================
      - name: Rename APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find app/build/outputs \
            -type f \
            -name "*.apk" \
            | head -n 1)

          cp "$APK" \
            "release/AutoClipperAI-Hybrid-v4.3.apk"

          ls -lh release/


      # ==================================================
      # 13. UPLOAD APK
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClipperAI-Hybrid-v4.3
          path: release/AutoClipperAI-Hybrid-v4.3.apk
          if-no-files-found: error
          retention-days: 30
