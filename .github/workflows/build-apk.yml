name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          echo "=== ROOT ==="
          ls -la

      - name: Extract source
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP source tidak ditemukan"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Find Android project
        run: |
          echo "=== HASIL EXTRACT ==="
          find project -maxdepth 3 -type f | head -100

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Gradle project
        run: |
          if [ -f "project/gradlew" ]; then
            echo "GRADLE_DIR=project" >> $GITHUB_ENV
          else
            DIR=$(find project -name gradlew -type f | head -n 1 | xargs -r dirname)

            if [ -z "$DIR" ]; then
              echo "ERROR: gradlew tidak ditemukan"
              exit 1
            fi

            echo "GRADLE_DIR=$DIR" >> $GITHUB_ENV
          fi

      - name: Build Debug APK
        run: |
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== APK ==="
          find "$GRADLE_DIR" -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClipperAI-debug
          path: |
            **/build/outputs/apk/debug/*.apk
